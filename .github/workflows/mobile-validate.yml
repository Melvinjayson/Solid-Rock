name: Mobile validation
on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck

  admin-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install admin dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck admin
        run: npm run typecheck

  web-uat-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Install browser dependencies
        run: npx playwright install --with-deps chromium
      - name: Run real-browser UAT smoke and capture screenshots
        run: npm run test:e2e
      - name: Upload UAT screenshots and browser traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: solid-rock-uat-screenshots
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 14

  sql-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL parser
        run: python -m pip install 'pglast>=7,<9'
      - name: Parse all database migrations
        run: |
          python - <<'PY'
          from pathlib import Path
          from pglast import parse_sql
          files=sorted(Path('supabase/migrations').glob('*.sql'))
          assert files, 'No migrations found'
          for f in files:
              parse_sql(f.read_text())
              print('Parsed:',f)
          print(f'{len(files)} SQL migrations parsed successfully (syntax only; RLS execution still requires staging)')
          PY
